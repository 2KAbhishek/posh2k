console_title_template = '{{ .Folder }}'
version = 3
final_space = true
streaming = 25

[transient_prompt]
  template = ' '
  foreground = '#1688f0'
  background = 'transparent'

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    leading_diamond = '╭─'
    trailing_diamond = ''
    template = ' {{ if .WSL }}WSL @ {{ end }}{{.Icon}}  '
    foreground = '#000'
    background = '#21c7a8'
    type = 'os'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '24h'

  [[blocks.segments]]
    template = ' '
    foreground = '#000'
    powerline_symbol = ''
    background = '#ef53d0'
    type = 'root'
    style = 'powerline'

    [blocks.segments.options]
      cache_duration = '24h'

  [[blocks.segments]]
    leading_diamond = '<transparent,#1688f0></>'
    trailing_diamond = '<#1688f0,transparent></>'
    template = '{{ path .Path .Location }}'
    foreground = '#000'
    powerline_symbol = ''
    background = '#1688f0'
    type = 'path'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = 'none'
      folder_icon = ' '
      folder_separator_icon = '/'
      home_icon = ' ~'
      style = 'unique'

  [[blocks.segments]]
    template = ' {{ url .UpstreamIcon .UpstreamURL }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
    foreground = '#000'
    powerline_symbol = ''
    background = '#20ff40'
    type = 'git'
    style = 'powerline'
    background_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}#ffcf0a{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#ff6c6c{{ end }}', '{{ if gt .Ahead 0 }}#18c230{{ end }}', '{{ if gt .Behind 0 }}#58d369{{ end }}']

    [blocks.segments.options]
      branch_ahead_icon = ' '
      branch_behind_icon = ' '
      branch_icon = ' '
      branch_max_length = 64.0
      cache_duration = 'none'
      fetch_stash_count = true
      fetch_status = true
      fetch_upstream_icon = true
      fetch_worktree_count = true
      truncate_symbol = ''

  [[blocks.segments]]
    leading_diamond = '<transparent,#26c6ee></>'
    trailing_diamond = ''
    template = ' {{ .CurrentDate | date .Format }}'
    foreground = '#000'
    background = '#26c6ee'
    type = 'time'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = 'none'
      time_format = 'Mon, 03:04 PM '

  [[blocks.segments]]
    leading_diamond = '<transparent,#f4356f></>'
    trailing_diamond = ''
    template = ' {{ .FormattedMs }}'
    foreground = '#000'
    background = '#f4356f'
    type = 'executiontime'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = 'none'
      style = 'roundrock'
      threshold = 10.0

[[blocks]]
  type = 'prompt'
  alignment = 'right'
  overflow = 'break'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#d6deeb></>'
    template = '{{ .Name }}'
    foreground = '#000'
    background = '#d6deeb'
    type = 'shell'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '24h'

      [blocks.segments.options.mapped_shell_names]
        bash = ' bash'
        cmd = ' cmd'
        fish = ' fish'
        pwsh = ' pwsh'
        zsh = ' zsh'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#ce092f></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#ce092f'
    type = 'angular'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#faa029></>'
    template = ' {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} '
    foreground = '#000'
    background = '#faa029'
    type = 'aws'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#337bb6></>'
    template = 'ﴃ {{ .EnvironmentName }} '
    foreground = '#000'
    background = '#337bb6'
    type = 'az'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#5398c2></>'
    template = '<#f5bf45></> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#5398c2'
    type = 'azfunc'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#5a7a94></>'
    template = '  cds {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#5a7a94'
    type = 'cds'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#ccc></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#ccc'
    type = 'crystal'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#1d5185></>'
    template = '  cf {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#1d5185'
    type = 'cf'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#1d5185></>'
    template = ' {{if .Org }}{{ .Org }}{{ end }}{{ if .Space }}/{{ .Space }}{{ end }} '
    foreground = '#000'
    background = '#1d5185'
    type = 'cftarget'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#01a300></>'
    template = '<#2829b2></> <#be1818></>  cmake {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#01a300'
    type = 'cmake'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#055b9c></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#055b9c'
    type = 'dart'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#0d6da8></>'
    template = '  {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#0d6da8'
    type = 'dotnet'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#06A4CE></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#06A4CE'
    type = 'flutter'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#06aad5></>'
    template = 'ﳑ {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#06aad5'
    type = 'go'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#906cff></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#906cff'
    type = 'haskell'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#fb2></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#fb2'
    type = 'java'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#945bb3></>'
    template = '<#ca3c34></> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#945bb3'
    type = 'julia'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#906cff></>'
    template = 'K {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#906cff'
    type = 'kotlin'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#316ce4></>'
    template = 'ﴱ {{.Context}} :: {{if .Namespace}}{{.Namespace}}{{else}}default{{end}} '
    foreground = '#000'
    background = '#316ce4'
    type = 'kubectl'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#0000aa></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#0000aa'
    type = 'lua'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#3c873a></>'
    template = ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
    foreground = '#000'
    background = '#3C873A'
    type = 'node'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'
      fetch_package_manager = true
      npm_icon = '<#cc3a3a></> '
      yarn_icon = '<#348cba></> '

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#6488c0></>'
    template = 'Nx {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#6488c0'
    type = 'nx'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#41436d></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#41436d'
    type = 'perl'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#787CB5></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#787CB5'
    type = 'php'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#306998></>'
    template = '  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}'
    foreground = '#000'
    background = '#306998'
    type = 'python'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#1c68bd></>'
    template = 'R {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#1c68bd'
    type = 'r'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#cc1006></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#cc1006'
    type = 'ruby'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#ff5b17></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    background = '#ff5b17'
    type = 'rust'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#fe862e></>'
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#000'
    background = '#fe862e'
    type = 'swift'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '1h'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = '<transparent,#ffbf28></>'
    template = ' {{ round .PhysicalPercentUsed .Precision }}% '
    foreground = '#000'
    background = '#ffbf28'
    type = 'sysinfo'
    style = 'diamond'

    [blocks.segments.options]
      cache_duration = '10s'

  [[blocks.segments]]
    leading_diamond = ''
    template = ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}% '
    foreground = '#000'
    background = '#ffeb3b'
    type = 'battery'
    style = 'diamond'
    background_templates = ['{{if eq "Charging" .State.String}}#40c4ff{{end}}', '{{if eq "Discharging" .State.String}}#fb2457{{end}}', '{{if eq "Full" .State.String}}#20ffa4{{end}}']

    [blocks.segments.options]
      cache_duration = '30s'
      charged_icon = '󱟢 '
      charging_icon = '󰂄 '
      discharging_icon = '󰂀 '

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '╰─'
    foreground = '#21c7a8'
    type = 'text'
    style = 'plain'

    [blocks.segments.options]
      cache_duration = 'none'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '{{ if gt .Code 0 }}[{{ .Code }}]{{ else }} {{ end }}'
    foreground = '#000'
    background = '#21c7a8'
    type = 'exit'
    style = 'diamond'
    foreground_templates = ['{{ if gt .Code 0 }}#c10e39{{ end }}']

    [blocks.segments.options]
      always_enabled = true
      cache_duration = 'none'
